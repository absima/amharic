[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "am-normalizer"
version = "0.1.0"
description = "Amharic Normalization (AN-v0) and Canonical Representation (CAR v0)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-dotenv",
]

# --- setuptools: package discovery ---
[tool.setuptools.packages.find]
where = ["."]
include = ["am_normalizer*"]

# --- setuptools: include non-.py data inside the wheel/sdist ---
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# to include everything under am_normalizer/data/ in the built distribution
am_normalizer = ["data/**/*"]